[btest]
TestDirs    = Tests
TmpDir      = %(testbase)s/.tmp
BaselineDir = %(testbase)s/Baseline
IgnoreDirs  = .svn CVS .tmp .git
IgnoreFiles = *.tmp *.swp #* *.trace .DS_Store

[environment]
# Everything the tests need ships with the package; nothing is taken from a
# Zeek source tree (zeek-config --zeek_dist), which binary installs lack.
# Make the package loadable as @load offensive-agency/scripts.
ZEEKPATH=`zeek-config --zeekpath`:%(testbase)s/../..
# Vendored helpers (have-zeromq, diff-canonifier) on PATH ahead of the rest.
PATH=%(testbase)s/Scripts%(pathsep)s%(default_path)s
ZEEK_SEED_FILE=%(testbase)s/random.seed
TZ=UTC
LC_ALL=C
TRACES=%(testbase)s/Traces
TEST_FILES=%(testbase)s/Files
# Vendored ZeroMQ cluster helpers (cluster-layout-*.zeek, test-bootstrap.zeek).
FILES=%(testbase)s/Files
PACKAGE=%(testbase)s/../scripts
TMPDIR=%(testbase)s/.tmp
TEST_DIFF_CANONIFIER=%(testbase)s/Scripts/diff-canonifier
