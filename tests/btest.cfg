[btest]
TestDirs    = Tests
TmpDir      = %(testbase)s/.tmp
BaselineDir = %(testbase)s/Baseline
IgnoreDirs  = .svn CVS .tmp .git
IgnoreFiles = *.tmp *.swp #* *.trace .DS_Store

[environment]
ZEEKBASE=`zeek-config --zeek_dist`
# Make the package loadable as @load offensive-agency/scripts.
ZEEKPATH=`zeek-config --zeekpath`:%(testbase)s/../..
# Zeek's testing/scripts on PATH so `@TEST-REQUIRES: have-zeromq` and the
# diff-canonifier resolve; keep the existing PATH intact.
PATH=`zeek-config --zeek_dist`/testing/scripts%(pathsep)s%(default_path)s
ZEEK_SEED_FILE=`zeek-config --zeek_dist`/testing/btest/random.seed
TZ=UTC
LC_ALL=C
TRACES=%(testbase)s/Traces
TEST_FILES=%(testbase)s/Files
# Cluster helper files shipped with the dist (cluster-layout-*.zeek, test-bootstrap.zeek):
FILES=`zeek-config --zeek_dist`/testing/btest/Files
DIST=`zeek-config --zeek_dist`
PACKAGE=%(testbase)s/../scripts
TMPDIR=%(testbase)s/.tmp
TEST_DIFF_CANONIFIER=`zeek-config --zeek_dist`/testing/scripts/diff-canonifier
